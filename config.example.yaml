# Copy to config.yaml and customize.
# Selectors are optional — job_monitor.py defaults cover Greenhouse, Lever,
# Workday, iCIMS, and common careers pages. Add job_link_selector /
# description_selector only when a site needs a tighter match.
#
# Paths are relative to the working directory unless absolute.

